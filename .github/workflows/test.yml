name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: The three things the tests lean on
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck zsh

      - name: The plugin, on a desk of its own
        run: test/run
